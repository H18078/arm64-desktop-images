#cloud-config
# Omarchy's own setup for the owner cloud-init made, as its installer runs it:
# the system part for that user, then the user's own; then SDDM, which waits
# for this, logs them straight into Omarchy.
write_files:
  - path: /etc/sddm.conf.d/autologin.conf
    content: |
      [Autologin]
      User={{user}}
      Session=omarchy.desktop
runcmd:
  - [env, OMARCHY_PATH=/usr/share/omarchy, OMARCHY_INSTALL=/usr/share/omarchy/install,
     OMARCHY_INSTALL_LOG_FILE=/var/log/omarchy-install.log,
     /usr/bin/omarchy-apply-system, --install-user, "{{user}}", --first-install]
  - [runuser, -u, "{{user}}", --, env, "HOME=/home/{{user}}", "USER={{user}}", "LOGNAME={{user}}",
     SHELL=/bin/bash, LANG=C.UTF-8, OMARCHY_PATH=/usr/share/omarchy,
     OMARCHY_INSTALL=/usr/share/omarchy/install, OMARCHY_SETUP_CONTEXT=provision-owner,
     /usr/share/omarchy/bin/omarchy-provision-user, --force, --first-install]
